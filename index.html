<html lang="ar" dir="rtl"><head><meta charset="UTF-8">

<title>GK LITE — بنك تمارين حراس المرمى</title>
<style>
:root{--bg:#EFF7FC;--card:#FFF;--soft:#F4FBFF;--line:#D8EAF6;--ink:#0A2233;--dim:#5B7E97;--sky:#0FA2E6;--deep:#075C8F;--pale:#D6EFFB;--hot:#FF6B4A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,sans-serif;padding-bottom:50px}
.wrap{max-width:700px;margin:0 auto;padding:0 12px}
header{background:linear-gradient(135deg,#064E7C,#0FA2E6 60%,#63D2F7);color:#fff;padding:18px 12px 48px;margin-bottom:-36px}
header .in{max-width:700px;margin:0 auto}
header h1{font-size:1.5rem;font-weight:900;margin:0}
header p{font-size:.78rem;margin:3px 0 0;opacity:.9}
.stats{display:flex;gap:16px;margin-top:10px}
.stat b{font-size:1.2rem;display:block;line-height:1}
.stat span{font-size:.66rem;opacity:.85}
.tabs{display:flex;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:5px;overflow-x:auto;box-shadow:0 6px 18px rgba(7,92,143,.1)}
.tab{flex:1 0 auto;background:transparent;border:none;color:var(--dim);font-family:inherit;font-size:.8rem;font-weight:700;padding:9px 12px;border-radius:9px;white-space:nowrap}
.tab.on{background:var(--sky);color:#fff}
#filters{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px;margin-top:11px}
.fl{font-size:.67rem;color:var(--dim);font-weight:700;margin:0 0 6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{flex:0 0 auto;background:var(--soft);border:1px solid var(--line);color:var(--dim);font-family:inherit;font-size:.75rem;font-weight:700;padding:7px 12px;border-radius:18px;white-space:nowrap}
.chip.on{background:var(--sky);border-color:var(--sky);color:#fff}
.hr{height:1px;background:var(--line);margin:10px 0}
.count{font-size:.74rem;color:var(--dim);font-weight:700;margin:15px 3px 9px}
.grid{display:flex;flex-direction:column;gap:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 4px 12px rgba(10,34,51,.06)}
.scene{position:relative;background:#17542C;overflow:hidden}
.scene::before{content:'';display:block;padding-top:70%}
.scene>svg{position:absolute;inset:0;width:100%;height:100%}
@supports (aspect-ratio:1){.scene{aspect-ratio:320/224}.scene::before{display:none}}
.shim{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.45);letter-spacing:3px}
.num{position:absolute;top:8px;right:10px;font-size:1.3rem;font-weight:900;color:#fff;opacity:.7}
.cbody{padding:12px 14px 14px}
.cbody h4{font-size:.98rem;margin:0 0 8px;line-height:1.4}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.m{font-size:.66rem;font-weight:700;padding:4px 9px;border-radius:6px}
.m.age{background:var(--sky);color:#fff}.m.ph{background:var(--pale);color:var(--deep)}
.m.n{background:var(--soft);color:var(--dim);border:1px solid var(--line)}
.blk{margin-bottom:8px}
.blk b{font-size:.67rem;color:var(--deep);display:block;margin-bottom:2px}
.blk p{margin:0;font-size:.84rem;color:var(--dim);line-height:1.65}
.blk.mat p{color:var(--hot);font-weight:600}
.pts{font-size:.8rem;background:var(--soft);border-right:3px solid var(--sky);border-radius:8px;padding:9px 11px;line-height:1.7;margin-top:8px}
.pts b{display:block;font-size:.67rem;color:var(--deep);margin-bottom:3px}
.pts.err{border-color:var(--hot);background:#FFF4F0}.pts.err b{color:#B23A1C}
.empty{color:var(--dim);text-align:center;padding:30px;background:var(--card);border:1px dashed var(--line);border-radius:14px;margin-top:12px}
.moreb{display:block;width:100%;margin-top:13px;background:var(--card);border:1px solid var(--line);color:var(--deep);font-family:inherit;font-weight:700;font-size:.8rem;padding:12px;border-radius:11px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:13px}
.panel h3{font-size:.95rem;margin:0 0 8px;color:var(--deep)}
label{display:block;font-size:.71rem;color:var(--dim);margin:10px 0 5px;font-weight:700}
select,input{width:100%;background:var(--soft);border:1px solid var(--line);color:var(--ink);font-family:inherit;font-size:.9rem;padding:10px;border-radius:9px}
.row2{display:flex;gap:8px}.row2>div{flex:1}
.go{background:var(--sky);color:#fff;width:100%;margin-top:14px;border:none;border-radius:10px;padding:13px;font-family:inherit;font-weight:700;font-size:.9rem}
.ptab{width:100%;border-collapse:collapse;font-size:.77rem;margin-top:6px}
.ptab th{background:var(--pale);color:var(--deep);font-size:.69rem;padding:7px 6px;text-align:right;border:1px solid var(--line)}
.ptab td{padding:8px 6px;border:1px solid var(--line);color:var(--dim);line-height:1.5}
.ptab td:first-child{color:var(--ink);font-weight:700;white-space:nowrap}
.pnote{font-size:.75rem;color:var(--hot);margin:8px 0 0;font-weight:600;line-height:1.6}
.ficheBar{display:flex;gap:8px;margin:13px 0 9px}
.ficheBar .mini{flex:1;padding:11px;font-size:.8rem;background:var(--card);border:1px solid var(--line);color:var(--deep);font-family:inherit;font-weight:700;border-radius:10px}
.fiche{background:#fff;border:1px solid #BBB;border-radius:6px;padding:11px;font-size:.75rem;color:#111}
.fh{background:#E8E8E8;border:1px solid #999;text-align:center;font-weight:700;padding:6px;margin-bottom:8px}
.ftop,.fobj{width:100%;border-collapse:collapse;margin-bottom:8px}
.ftop td,.fobj td{border:1px solid #999;padding:6px 7px;font-size:.71rem}
.fobj .big{font-size:.92rem;font-weight:700;margin:3px 0;color:#075C8F}
.fblock{border:1px solid #999;margin-bottom:8px;padding:8px 9px}
.fbh{background:#E8E8E8;border:1px solid #999;font-weight:700;text-align:center;padding:4px;margin:-8px -9px 7px;font-size:.73rem}
.fblock p{margin:0 0 4px;line-height:1.6;font-size:.71rem}
.fp{border-top:1px dashed #BBB;padding-top:4px;color:#075C8F}
.fpick{display:flex;gap:5px;margin-bottom:7px}
.fpick select{flex:1;font-size:.71rem;padding:6px}
.fpick input{flex:0 0 60px;font-size:.71rem;padding:6px;text-align:center}
.fbilan{border:1px solid #999;padding:7px 9px}
.lines{height:50px;background:repeating-linear-gradient(#fff 0 16px,#DDD 16px 17px)}

.sceneBar{display:flex;gap:6px;padding:8px 10px;background:var(--soft);border-bottom:1px solid var(--line)}
.pbtn{background:var(--sky);color:#fff;border:none;border-radius:8px;padding:7px 13px;font-family:inherit;font-weight:700;font-size:.75rem}
.pbtn.alt{background:var(--card);color:var(--deep);border:1px solid var(--line)}
.animbar{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:8px 10px;background:#0A3A1E}
.ab{background:rgba(255,255,255,.15);border:none;color:#fff;font-family:inherit;font-size:.75rem;font-weight:700;padding:6px 10px;border-radius:7px}
.ab.sp{font-size:.67rem;padding:5px 8px;background:rgba(255,255,255,.08)}
.astep{flex:1;color:#CFF3D9;font-size:.71rem;font-weight:700;text-align:center;min-width:66px}
.board{background:#17542C;border-radius:11px;overflow:hidden;margin-top:8px;border:1px solid var(--line)}
.board svg{width:100%;height:auto;display:block}
.palette{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0}
.palette.sub{margin-top:0;padding:8px;background:var(--soft);border-radius:9px}
.tl{background:var(--soft);border:1px solid var(--line);color:var(--dim);font-family:inherit;font-size:.71rem;font-weight:700;padding:6px 10px;border-radius:8px}
.tl.sm{font-size:.67rem;padding:5px 9px}
.tl.on{background:var(--deep);border-color:var(--deep);color:#fff}
.bbar{display:flex;gap:7px;align-items:center;margin-top:7px}
.hint{flex:1;font-size:.71rem;color:var(--deep);font-weight:700}
.mini{background:var(--soft);border:1px solid var(--line);color:var(--dim);font-family:inherit;font-size:.71rem;font-weight:700;padding:7px 11px;border-radius:8px}
.cv3d{position:relative;margin-top:8px;border-radius:11px;overflow:hidden;border:1px solid var(--line);background:#BEE6F7}
.cv3d canvas{width:100%;display:block}
.cvhint{position:absolute;bottom:8px;right:10px;background:rgba(5,38,58,.6);color:#fff;font-size:.65rem;padding:4px 9px;border-radius:6px}
.cvload{font-size:.76rem;color:var(--deep);font-weight:700;text-align:center;padding:10px}
@media print{header,.tabs,#filters,.ficheBar,.noprint,.fpick{display:none!important}body{background:#fff}.fiche{border:none;padding:0}@page{size:A4;margin:10mm}}
</style></head>

  return `<rect x="0" y="0" width="${W}" height="${H}" fill="url(#skyG)"/>
  <rect x="0" y="0" width="${W}" height="${Math.max(0,horizon)}" fill="url(#skyG)"/>
  <polygon points="${a.x},${a.y} ${b.x},${b.y} ${c.x},${c.y} ${d.x},${d.y}" fill="url(#${g})"/>
  <polygon points="${a.x},${a.y} ${b.x},${b.y} ${c.x},${c.y} ${d.x},${d.y}" fill="#fff" filter="url(#grain)" opacity=".55"/>`;

function QUAD(view,x1,x2,y1,y2,op,w){
  const A=proj(view,x1,y1),B=proj(view,x2,y1),C=proj(view,x2,y2),D=proj(view,x1,y2), ww=w||1.8;
  const pts=`${A.x},${A.y} ${B.x},${B.y} ${C.x},${C.y} ${D.x},${D.y}`;
  return `<polygon points="${pts}" transform="translate(0,1)" fill="none" stroke="#124A26" stroke-opacity=".25" stroke-width="${ww}"/>
  <polygon points="${pts}" fill="none" stroke="#fff" stroke-opacity="${op||.92}" stroke-width="${ww}"/>`;
}
/* مرمى بمنظور بشباك كثيف */
function GOAL3D(view,x1,x2,fy,h){
  const l=proj(view,x1,fy), r=proj(view,x2,fy), d=14, t=4.2;
  let n='';
  for(let i=0;i<=12;i++){ const x=l.x+(r.x-l.x)/12*i;
    n+=`<line x1="${x}" y1="${l.y}" x2="${x+d*.34}" y2="${l.y-h-d*.08}" stroke="#fff" stroke-opacity=".5" stroke-width=".62"/>`; }
  for(let j=1;j<=5;j++){ const tt=j/5, y=l.y-h*tt;
    n+=`<line x1="${l.x+d*.34*tt}" y1="${y-d*.08*tt}" x2="${r.x+d*.34*tt}" y2="${y-d*.08*tt}" stroke="#fff" stroke-opacity=".36" stroke-width=".58"/>`; }
  return `<ellipse cx="${(l.x+r.x)/2}" cy="${l.y+2}" rx="${(r.x-l.x)/2+6}" ry="4" fill="url(#shadowG)" filter="url(#blur3)"/>
  <polygon points="${l.x},${l.y} ${r.x},${r.y} ${r.x+d*.34},${r.y-h-d*.08} ${l.x+d*.34},${l.y-h-d*.08}" fill="#fff" fill-opacity=".10"/>${n}
  <rect x="${l.x-t/2}" y="${l.y-h}" width="${t}" height="${h}" fill="url(#postG)" rx="${t/2}"/>
  <rect x="${r.x-t/2}" y="${r.y-h}" width="${t}" height="${h}" fill="url(#postG)" rx="${t/2}"/>
  <rect x="${l.x-t/2}" y="${l.y-h-t*0.95}" width="${r.x-l.x+t}" height="${t}" fill="url(#postG)" rx="${t/2}"/>
  <rect x="${l.x-t/2}" y="${l.y-h}" width="${t*0.36}" height="${h}" fill="#fff" opacity=".7"/>
  <rect x="${r.x-t/2}" y="${r.y-h}" width="${t*0.36}" height="${h}" fill="#fff" opacity=".7"/>`;

function GOALFLAT(view,x1,x2,fy){
  const l=proj(view,x1,fy), r=proj(view,x2,fy), d=13;
  let n='';
  for(let i=0;i<=11;i++){ const x=l.x+(r.x-l.x)/11*i;
    n+=`<line x1="${x}" y1="${l.y}" x2="${x}" y2="${l.y-d}" stroke="#fff" stroke-opacity=".45" stroke-width=".6"/>`; }
  for(let j=1;j<=3;j++) n+=`<line x1="${l.x}" y1="${l.y-d*j/3}" x2="${r.x}" y2="${l.y-d*j/3}" stroke="#fff" stroke-opacity=".3" stroke-width=".55"/>`;
  return `<rect x="${l.x}" y="${l.y-d}" width="${r.x-l.x}" height="${d}" fill="#fff" fill-opacity=".13"/>${n}
  <rect x="${l.x-1.8}" y="${l.y-d}" width="3.6" height="${d+2.4}" fill="url(#postG)" rx="1.8"/>
  <rect x="${r.x-1.8}" y="${l.y-d}" width="3.6" height="${d+2.4}" fill="url(#postG)" rx="1.8"/>
  <line x1="${l.x}" y1="${l.y}" x2="${r.x}" y2="${l.y}" stroke="#fff" stroke-width="2.6"/>`;

function ARC(view,cx,cy,rx,ry,up){

  <path d="M${a.x},${a.y} Q${c.x},${c.y+dy} ${b.x},${b.y}" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="1.8"/>`;

/* خطوط جزّ العشب المنحنية */
function stripes(view,n){
  let s='';
  for(let i=0;i<n;i++){
    if(i%2) continue;
    const a=proj(view,-.2,i/n), b=proj(view,1.2,i/n), c=proj(view,1.2,(i+1)/n), d=proj(view,-.2,(i+1)/n);
    s+=`<polygon points="${a.x},${a.y} ${b.x},${b.y} ${c.x},${c.y} ${d.x},${d.y}" fill="#fff" fill-opacity=".075"/>`;
  }

      s += L(view,-.2,0,1.2,0,.9,2.2) + QUAD(view,.30,.70,0,.22,.7,1.5) + QUAD(view,.09,.91,0,.64,.85,1.8);
      s += dot(view,.5,.42) + ARC(view,.5,.64,.17,.17,false);
      s += (view==='box3d') ? GOAL3D(view,.345,.655,0,27) : GOALFLAT(view,.345,.655,0);
      break;
    case 'half3d': case 'halftop':
      s += L(view,-.2,0,1.2,0,.9,2.2) + QUAD(view,.34,.66,0,.12,.7,1.4) + QUAD(view,.16,.84,0,.36,.85,1.7);
      s += dot(view,.5,.24) + ARC(view,.5,.36,.12,.10,false);
      s += L(view,-.15,1,1.15,1,.9,2.2) + ARC(view,.5,1,.26,.22,true);

      s += QUAD(view,.36,.64,.92,.98,.7,1.3) + QUAD(view,.20,.80,.80,.98,.8,1.5);
      s += dot(view,.5,.13) + dot(view,.5,.87) + dot(view,.5,.5);
      s += GOALFLAT(view,.42,.58,.02);

      s += L(view,-.2,0,1.2,0,.9,2.4) + QUAD(view,.14,.86,0,.5,.85,2);
      s += dot(view,.5,.86) + GOAL3D(view,.28,.72,0,30);

    case 'corner3d':
      s += L(view,-.2,0,1.2,0,.9,2.2) + QUAD(view,.10,.90,0,.58,.85,1.8) + QUAD(view,.32,.68,0,.20,.7,1.4);
      s += dot(view,.5,.40) + GOAL3D(view,.36,.64,0,26);

    case 'side': {

      s += bgFill(view).split('</rect>')[1] || '';

      s += sideGoal(view);

      break; }
    case 'front':
      s += L(view,-.2,0,1.2,0,.85,2) + QUAD(view,.10,.90,0,.62,.8,1.6);
      s += GOAL3D(view,.30,.70,0,44);
      s += dot(view,.5,.42);
      break;
    case 'back':
      s += L(view,-.2,1,1.2,1,.85,2) + QUAD(view,.10,.90,.4,1,.8,1.6);

function sideGoal(view){

  return `<polygon points="${b.x},${b.y-h} ${b.x},${b.y} ${b.x-d},${b.y} ${b.x-d},${b.y-h*.42}" fill="#fff" fill-opacity=".12"/>${n}
  <rect x="${b.x-2}" y="${b.y-h}" width="4" height="${h}" fill="url(#po)" rx="2"/>
  <rect x="${b.x-d}" y="${b.y-h}" width="${d}" height="4" fill="url(#po)" rx="2"/>`;
}
function dot(view,fx,fy){ const p=proj(view,fx,fy); return `<circle cx="${p.x}" cy="${p.y}" r="2.4" fill="#fff" fill-opacity=".9"/>`; }
function circle(view,fx,fy,r){

}

function limb(x1,y1,x2,y2,w,fill){

       +thigh(cx-5*u,cy+6*u,cx-12*u,cy+9*u)+sock(cx-12*u,cy+9*u,cx-18*u,cy+11*u)+boot(cx-19*u,cy+11.5*u,4,u)
       +torso(cx,cy+2*u,shoW,15*u,J,'',-78)
       +arm(cx+5*u,cy,cx+13*u,cy+2*u)+fore(cx+13*u,cy+2*u,cx+20*u,cy+3*u)+glove(cx+22*u,cy+3.5*u,3.3*u,-8)
       +arm(cx+4*u,cy+3*u,cx+12*u,cy+5*u)+fore(cx+12*u,cy+5*u,cx+19*u,cy+6*u)+glove(cx+21*u,cy+6.5*u,3.3*u,-4)
       +headFull(cx+7*u,cy-4*u,hr*.96,-12);
      tagY=cy-12*u; tagX=cx+9*u; break; }

    case 'down': {
      const cy=Y-4*u;
      g=SHADOW(X,Y+1*u,18*u,4.4*u)
       +thigh(X-4*u,cy,X-13*u,cy+1*u)+sock(X-13*u,cy+1*u,X-20*u,cy+2*u)+boot(X-21*u,cy+2.5*u,2,u)
       +torso(X+2*u,cy-1*u,shoW*0.95,14*u,J,'',-88)
       +arm(X+7*u,cy-2*u,X+15*u,cy-2*u)+glove(X+18*u,cy-2*u,3.2*u,0)
       +headFull(X+11*u,cy-6*u,hr*.94,-8);
      tagY=cy-13*u; tagX=X+11*u; break; }

    case 'jump': {
      const cy=Y-26*u;
      g=SHADOW(X,Y+1*u,10*u,3*u,.6)
       +thigh(X-2.6*u,cy+8*u,X-4.5*u,cy+16*u)+sock(X-4.5*u,cy+16*u,X-4*u,cy+23*u)+boot(X-4*u,cy+24*u,-6,u)
       +thigh(X+2.6*u,cy+8*u,X+6*u,cy+14*u)+sock(X+6*u,cy+14*u,X+8*u,cy+20*u)+boot(X+8.5*u,cy+21*u,18,u)
       +torso(X,cy+2*u,shoW,16*u,J,'')
       +arm(X-5.5*u,cy-3*u,X-9*u,cy-12*u)+fore(X-9*u,cy-12*u,X-10*u,cy-20*u)+glove(X-10.5*u,cy-23*u,3.5*u,-8)
       +arm(X+5.5*u,cy-3*u,X+9*u,cy-12*u)+fore(X+9*u,cy-12*u,X+10*u,cy-20*u)+glove(X+10.5*u,cy-23*u,3.5*u,8)
       +headFull(X,cy-9*u,hr,0);
      tagY=cy-28*u; break; }

    case 'kneel': {
      const cy=Y-11*u;
      g=SHADOW(X,Y+1*u,12*u,3.6*u)
       +thigh(X-3*u,cy+6*u,X-9*u,cy+10*u)+sock(X-9*u,cy+10*u,X-9*u,cy+11*u)
       +thigh(X+3*u,cy+6*u,X+6*u,cy+11*u)+sock(X+6*u,cy+11*u,X+9*u,cy+11*u)+boot(X+10*u,cy+11.5*u,0,u)
       +torso(X,cy,shoW,15*u,J,'')
       +arm(X-5.5*u,cy-4*u,X-9*u,cy+3*u)+glove(X-10*u,cy+6*u,3.2*u,-12)
       +arm(X+5.5*u,cy-4*u,X+9*u,cy+3*u)+glove(X+10*u,cy+6*u,3.2*u,12)
       +headFull(X,cy-11*u,hr,0);
      tagY=cy-17*u; break; }

    case 'spread': {
      const cy=Y-13*u;
      g=SHADOW(X,Y+1*u,17*u,4.4*u)
       +thigh(X-3*u,cy+7*u,X-11*u,cy+12*u)+sock(X-11*u,cy+12*u,X-17*u,cy+13*u)+boot(X-18*u,cy+13.5*u,4,u)
       +thigh(X+3*u,cy+7*u,X+11*u,cy+12*u)+sock(X+11*u,cy+12*u,X+17*u,cy+13*u)+boot(X+18*u,cy+13.5*u,-4,u)
       +torso(X,cy,shoW*1.05,15*u,J,'')
       +arm(X-6*u,cy-3*u,X-13*u,cy+2*u)+fore(X-13*u,cy+2*u,X-19*u,cy+6*u)+glove(X-21*u,cy+7*u,3.4*u,-24)
       +arm(X+6*u,cy-3*u,X+13*u,cy+2*u)+fore(X+13*u,cy+2*u,X+19*u,cy+6*u)+glove(X+21*u,cy+7*u,3.4*u,24)
       +headFull(X,cy-11*u,hr,0);
      tagY=cy-17*u; break; }

    case 'catch': {
      const cy=Y-16*u;
      g=SHADOW(X,Y+1*u,11*u,3.4*u)
       +thigh(X-2.8*u,cy+8*u,X-3.6*u,cy+14*u)+sock(X-3.6*u,cy+14*u,X-3.6*u,cy+20*u)+boot(X-3.6*u,cy+21*u,-4,u)
       +thigh(X+2.8*u,cy+8*u,X+3.6*u,cy+14*u)+sock(X+3.6*u,cy+14*u,X+3.6*u,cy+20*u)+boot(X+3.6*u,cy+21*u,4,u)
       +torso(X,cy+2*u,shoW,16*u,J,'')
       +arm(X-5.5*u,cy-2*u,X-6*u,cy-9*u)+fore(X-6*u,cy-9*u,X-4*u,cy-15*u)+glove(X-3.6*u,cy-17*u,3.4*u,-14)
       +arm(X+5.5*u,cy-2*u,X+6*u,cy-9*u)+fore(X+6*u,cy-9*u,X+4*u,cy-15*u)+glove(X+3.6*u,cy-17*u,3.4*u,14)
       +`<circle cx="${X}" cy="${cy-19*u}" r="${5*u}" fill="url(#ballG)" stroke="#0A2233" stroke-width="${0.9*u}"/>`
       +headFull(X,cy-8*u,hr,0);
      tagY=cy-26*u; break; }

    case 'punch': {
      const cy=Y-16*u;
      g=SHADOW(X,Y+1*u,11*u,3.4*u)
       +thigh(X-2.8*u,cy+8*u,X-4*u,cy+14*u)+sock(X-4*u,cy+14*u,X-4*u,cy+20*u)+boot(X-4*u,cy+21*u,-4,u)
       +thigh(X+2.8*u,cy+8*u,X+4*u,cy+14*u)+sock(X+4*u,cy+14*u,X+4*u,cy+20*u)+boot(X+4*u,cy+21*u,4,u)
       +torso(X,cy+2*u,shoW,16*u,J,'')
       +arm(X-5.5*u,cy-2*u,X-3*u,cy-10*u)+fore(X-3*u,cy-10*u,X-1*u,cy-17*u)+glove(X-0.5*u,cy-19*u,3.6*u,-6)
       +arm(X+5.5*u,cy-2*u,X+7*u,cy-6*u)+fore(X+7*u,cy-6*u,X+9*u,cy-11*u)+glove(X+9.5*u,cy-13*u,3.2*u,16)
       +headFull(X-1.5*u,cy-8*u,hr,-6);
      tagY=cy-26*u; break; }

    case 'block': {
      const cy=Y-12*u;
      g=SHADOW(X,Y+1*u,15*u,4*u)
       +thigh(X-3*u,cy+7*u,X-12*u,cy+11*u)+sock(X-12*u,cy+11*u,X-18*u,cy+12*u)+boot(X-19*u,cy+12.5*u,4,u)
       +thigh(X+3*u,cy+7*u,X+6*u,cy+13*u)+sock(X+6*u,cy+13*u,X+7*u,cy+19*u)+boot(X+7*u,cy+20*u,6,u)
       +torso(X,cy,shoW,15*u,J,'',-10)
       +arm(X-6*u,cy-3*u,X-13*u,cy-1*u)+glove(X-15*u,cy,3.2*u,-16)
       +arm(X+6*u,cy-3*u,X+11*u,cy-6*u)+glove(X+13*u,cy-7*u,3.2*u,20)
       +headFull(X-1*u,cy-11*u,hr,-8);
      tagY=cy-17*u; break; }

    default: { /* set / stand */
      const crouch = pose==='set' ? 1 : 0;
      const cy=Y-(17-crouch*2)*u;
      g=SHADOW(X,Y+1*u,11*u,3.4*u)
       +thigh(X-3*u,cy+8*u,X-5*u,cy+(13+crouch)*u)+sock(X-5*u,cy+(13+crouch)*u,X-5*u,cy+(20-crouch)*u)+boot(X-5*u,cy+(21-crouch)*u,-6,u)
       +thigh(X+3*u,cy+8*u,X+5*u,cy+(13+crouch)*u)+sock(X+5*u,cy+(13+crouch)*u,X+5*u,cy+(20-crouch)*u)+boot(X+5*u,cy+(21-crouch)*u,6,u)
       +torso(X,cy+2*u,shoW,16*u,J,'')
       +arm(X-5.5*u,cy-2*u,X-(9+crouch*1.5)*u,cy+4*u)+fore(X-(9+crouch*1.5)*u,cy+4*u,X-(11+crouch*2)*u,cy+9*u)+glove(X-(12+crouch*2)*u,cy+11*u,3.3*u,-20)
       +arm(X+5.5*u,cy-2*u,X+(9+crouch*1.5)*u,cy+4*u)+fore(X+(9+crouch*1.5)*u,cy+4*u,X+(11+crouch*2)*u,cy+9*u)+glove(X+(12+crouch*2)*u,cy+11*u,3.3*u,20)
       +headFull(X,cy-8*u,hr,0);
      tagY=cy-15*u; }
  }
  return g+nameTag(tagX,tagY,s,label||'GK','#F5A623','#fff');
}

/* ============ لاعب الميدان ============ */
function PLAYER(view,fx,fy,kind,label){
  const p=proj(view,fx,fy), X=p.x, Y=p.y, s=p.s;
  const u=s, hr=5*u, shoW=12.5*u;
  const J = kind==='tm' ? 'url(#jerseyTM)' : 'url(#jerseyAT)';
  const sockC = kind==='tm' ? '#0B4F7C' : '#DCE7EE';
  const cy=Y-17*u;
  const thigh=(x1,y1,x2,y2)=>limb(x1,y1,x2,y2,4.2*u,'url(#shortG)');
  const sock=(x1,y1,x2,y2)=>limb(x1,y1,x2,y2,3.2*u,sockC);
  const arm=(x1,y1,x2,y2)=>limb(x1,y1,x2,y2,3.3*u,J);
  const fore=(x1,y1,x2,y2)=>limb(x1,y1,x2,y2,2.9*u,'url(#skinG)');
  const g=SHADOW(X,Y+1*u,10.5*u,3.2*u)
   +thigh(X-3*u,cy+8*u,X-4.6*u,cy+13*u)+sock(X-4.6*u,cy+13*u,X-4.6*u,cy+19.5*u)+boot(X-4.6*u,cy+20.5*u,-6,u)
   +thigh(X+3*u,cy+8*u,X+4.6*u,cy+13*u)+sock(X+4.6*u,cy+13*u,X+4.6*u,cy+19.5*u)+boot(X+4.6*u,cy+20.5*u,6,u)
   +torso(X,cy+2*u,shoW,15.5*u,J,label&&label.length<3?label:'')
   +arm(X-5.3*u,cy-2*u,X-8*u,cy+4*u)+fore(X-8*u,cy+4*u,X-9*u,cy+9*u)
   +arm(X+5.3*u,cy-2*u,X+8*u,cy+4*u)+fore(X+8*u,cy+4*u,X+9*u,cy+9*u)
   +headFull(X,cy-8*u,hr,0);
  const bg = kind==='tm' ? '#0D5C8C' : '#FFFFFF';
  const fg = kind==='tm' ? '#FFFFFF' : '#0A2233';
  return g+nameTag(X,cy-15*u,s,label||'',bg,fg);
}

/* ============ الكرة ============ */
function BALL(view,fx,fy){
  const p=proj(view,fx,fy), r=5.6*p.s, X=p.x, Y=p.y-r*0.55;
  let pent='';
  for(let i=0;i<5;i++){
    const a=i*72*Math.PI/180-Math.PI/2, rr=r*0.62;
    const cx=X+Math.cos(a)*rr, cy=Y+Math.sin(a)*rr*0.92;
    pent+=`<circle cx="${cx}" cy="${cy}" r="${r*0.2}" fill="#14242E" opacity=".82"/>`;
  }
  return SHADOW(X,Y+r*1.1,r*1.15,r*0.36)
   +`<circle cx="${X}" cy="${Y}" r="${r}" fill="url(#ballG)" stroke="#0A2233" stroke-opacity=".55" stroke-width="${r*0.13}"/>
     <path d="M${X-r*0.42},${Y-r*0.1} l${r*0.42},-${r*0.4} l${r*0.42},${r*0.4} l-${r*0.26},${r*0.46} l-${r*0.33},0 z" fill="#14242E" opacity=".88"/>
     ${pent}
     <ellipse cx="${X-r*0.34}" cy="${Y-r*0.4}" rx="${r*0.34}" ry="${r*0.22}" fill="#fff" opacity=".55"/>`;
}

/* ============ الأدوات ============ */
function CONE(view,fx,fy){
  const p=proj(view,fx,fy), s=p.s, X=p.x, Y=p.y;
  return SHADOW(X+1.5*s,Y+1*s,6.5*s,2.2*s)
   +`<ellipse cx="${X}" cy="${Y}" rx="${6.4*s}" ry="${2.2*s}" fill="#B33A16"/>
     <path d="M${X},${Y-12*s} L${X+5.4*s},${Y} q${-5.4*s},${2.1*s} ${-10.8*s},0 z" fill="url(#coneG)"/>
     <path d="M${X},${Y-12*s} l${-1.6*s},${12*s}" stroke="#fff" stroke-opacity=".3" stroke-width="${1.1*s}"/>
     <path d="M${X-3.1*s},${Y-5*s} q${3.1*s},${1.1*s} ${6.2*s},0" stroke="#fff" stroke-opacity=".55" stroke-width="${1.4*s}" fill="none"/>`;
}
function netMesh(x1,x2,ytop,ybot,d,cols,rows){
  let n='';
  for(let i=0;i<=cols;i++){ const x=x1+(x2-x1)/cols*i;
    n+=`<line x1="${x}" y1="${ybot}" x2="${x+d*0.34}" y2="${ytop-d*0.1}" stroke="#fff" stroke-opacity=".55" stroke-width=".65"/>`; }
  for(let j=0;j<=rows;j++){ const t=j/rows, y=ybot+(ytop-ybot)*t;
    n+=`<line x1="${x1+d*0.34*t}" y1="${y-d*0.1*t}" x2="${x2+d*0.34*t}" y2="${y-d*0.1*t}" stroke="#fff" stroke-opacity=".4" stroke-width=".6"/>`; }
  return n;
}
function goalFrame(x1,x2,ybase,h,d,thick){
  const t=thick||4;
  return `<polygon points="${x1},${ybase} ${x2},${ybase} ${x2+d*0.34},${ybase-h-d*0.1} ${x1+d*0.34},${ybase-h-d*0.1}" fill="#fff" fill-opacity=".10"/>
  ${netMesh(x1,x2,ybase-h,ybase,d,10,4)}
  <rect x="${x1-t/2}" y="${ybase-h}" width="${t}" height="${h}" fill="url(#postG)" rx="${t/2}"/>
  <rect x="${x2-t/2}" y="${ybase-h}" width="${t}" height="${h}" fill="url(#postG)" rx="${t/2}"/>
  <rect x="${x1-t/2}" y="${ybase-h-t*0.9}" width="${x2-x1+t}" height="${t}" fill="url(#postG)" rx="${t/2}"/>
  <rect x="${x1-t/2}" y="${ybase-h}" width="${t*0.4}" height="${h}" fill="#fff" opacity=".65"/>`;
}
function MINIGOAL(view,fx,fy){
  const p=proj(view,fx,fy), s=p.s, w=38*s, h=15*s;
  return SHADOW(p.x,p.y+1*s,w*0.56,3.4*s)+goalFrame(p.x-w/2,p.x+w/2,p.y,h,7*s,2.8*s);
}
function BIGGOAL(view,fx,fy){
  const p=proj(view,fx,fy), s=p.s, w=80*s, h=30*s;
  return SHADOW(p.x,p.y+1*s,w*0.52,4*s)+goalFrame(p.x-w/2,p.x+w/2,p.y,h,10*s,3.6*s);
}
function MANNEQUIN(view,fx,fy){
  const p=proj(view,fx,fy), s=p.s, X=p.x, Y=p.y;
  return SHADOW(X,Y+1*s,8*s,2.8*s)
   +`<ellipse cx="${X}" cy="${Y}" rx="${7.5*s}" ry="${2.6*s}" fill="#16301C"/>
     <rect x="${X-1.7*s}" y="${Y-10*s}" width="${3.4*s}" height="${10*s}" fill="#2B3843"/>
     <path d="M${X-5.6*s},${Y-9*s} q0,${-17*s} ${5.6*s},${-17*s} q${5.6*s},0 ${5.6*s},${17*s} z" fill="url(#coneG)" stroke="#7C2409" stroke-opacity=".4" stroke-width="${0.7*s}"/>
     <circle cx="${X}" cy="${Y-29*s}" r="${3.8*s}" fill="url(#coneG)" stroke="#7C2409" stroke-opacity=".4" stroke-width="${0.7*s}"/>
     <path d="M${X-3.4*s},${Y-22*s} q${3.4*s},${-1.4*s} ${6.8*s},0" stroke="#fff" stroke-opacity=".35" stroke-width="${1*s}" fill="none"/>`;
}
function POLE(view,fx,fy){
  const p=proj(view,fx,fy), s=p.s, X=p.x, Y=p.y;
  let bands='';
  for(let i=0;i<4;i++) bands+=`<rect x="${X-1.5*s}" y="${Y-(30-i*8)*s}" width="${3*s}" height="${4*s}" fill="#fff"/>`;
  return SHADOW(X,Y+1*s,4.5*s,1.8*s)
   +`<ellipse cx="${X}" cy="${Y}" rx="${4.2*s}" ry="${1.6*s}" fill="#16301C"/>
     <rect x="${X-1.5*s}" y="${Y-32*s}" width="${3*s}" height="${32*s}" rx="${1.5*s}" fill="url(#coneG)"/>${bands}
     <rect x="${X-1.5*s}" y="${Y-32*s}" width="${1*s}" height="${32*s}" fill="#fff" opacity=".3"/>`;
}
function HURDLE(view,fx,fy){
  const p=proj(view,fx,fy), s=p.s, X=p.x, Y=p.y, w=22*s, h=11*s;
  return SHADOW(X,Y+1*s,w*0.55,2.6*s)
   +`<rect x="${X-w/2}" y="${Y-h}" width="${2.6*s}" height="${h}" rx="${1.3*s}" fill="#F7B21F"/>
     <rect x="${X+w/2-2.6*s}" y="${Y-h}" width="${2.6*s}" height="${h}" rx="${1.3*s}" fill="#F7B21F"/>
     <rect x="${X-w/2}" y="${Y-h}" width="${w}" height="${3*s}" rx="${1.5*s}" fill="url(#coneG)"/>
     <rect x="${X-w/2}" y="${Y-h}" width="${w}" height="${1.1*s}" rx="${0.5*s}" fill="#fff" opacity=".35"/>`;
}
function LADDER(view,fx,fy){
  const p=proj(view,fx,fy), s=p.s, X=p.x, Y=p.y, w=28*s;
  let r='';
  for(let i=0;i<5;i++){ const yy=Y-i*7*s, ww=w*(1-i*0.055);
    r+=`<rect x="${X-ww/2}" y="${yy}" width="${ww}" height="${1.9*s}" rx="${0.9*s}" fill="#F7D774"/>`; }
  return `<polygon points="${X-w/2},${Y+2*s} ${X+w/2},${Y+2*s} ${X+w*0.44},${Y-28*s} ${X-w*0.44},${Y-28*s}" fill="#F7B21F" fill-opacity=".18" stroke="#F7D774" stroke-opacity=".8" stroke-width="${1.1*s}"/>${r}`;
}
function RING(view,fx,fy){
  const p=proj(view,fx,fy), s=p.s;
  return `<ellipse cx="${p.x}" cy="${p.y}" rx="${10*s}" ry="${4*s}" fill="none" stroke="#F7B21F" stroke-width="${2.6*s}"/>
  <ellipse cx="${p.x}" cy="${p.y-0.8*s}" rx="${10*s}" ry="${4*s}" fill="none" stroke="#FFE9A8" stroke-width="${1*s}" opacity=".7"/>`;
}

const TOOLS={gk:{label:'حارس',pose:true},at:{label:'مهاجم'},tm:{label:'زميل'},ball:{label:'كرة'},
  cone:{label:'كون'},minigoal:{label:'مرمى صغير'},biggoal:{label:'مرمى كبير'},mannequin:{label:'مجسّم لاعب'},
  pole:{label:'عصا'},hurdle:{label:'حاجز'},ladder:{label:'سلّم رشاقة'},ring:{label:'حلقة'}};

function drawItem(view,it){
  switch(it.t){
    case 'gk': return GK(view,it.x,it.y,it.pose||'set',it.lb||'GK');
    case 'at': return PLAYER(view,it.x,it.y,'at',it.lb||'A');
    case 'tm': return PLAYER(view,it.x,it.y,'tm',it.lb||'2');
    case 'ball': return BALL(view,it.x,it.y);
    case 'cone': return CONE(view,it.x,it.y);
    case 'minigoal': return MINIGOAL(view,it.x,it.y);
    case 'biggoal': return BIGGOAL(view,it.x,it.y);
    case 'mannequin': return MANNEQUIN(view,it.x,it.y);
    case 'pole': return POLE(view,it.x,it.y);
    case 'hurdle': return HURDLE(view,it.x,it.y);
    case 'ladder': return LADDER(view,it.x,it.y);
    case 'ring': return RING(view,it.x,it.y);
  }
  return '';
}

const ARROW_KINDS={move:{label:'حركة لاعب',c:'#FF6B4A',dash:'8,5'},
  pass:{label:'مسار الكرة',c:'#FFFFFF',dash:'0'},
  dribble:{label:'مراوغة بالكرة',c:'#FFD277',dash:'3,4'}};
function drawArrow(view,a){
  const K=ARROW_KINDS[a.k]||ARROW_KINDS.move;
  const p1=proj(view,a.x1,a.y1), p2=proj(view,a.x2,a.y2);
  const x1=p1.x,y1=p1.y-10,x2=p2.x,y2=p2.y-10;
  const ang=Math.atan2(y2-y1,x2-x1), ax=x2-11*Math.cos(ang), ay=y2-11*Math.sin(ang);
  return `<line x1="${x1}" y1="${y1+1.5}" x2="${ax}" y2="${ay+1.5}" stroke="#04202F" stroke-opacity=".3" stroke-width="3.4" stroke-dasharray="${K.dash}" stroke-linecap="round"/>
  <line x1="${x1}" y1="${y1}" x2="${ax}" y2="${ay}" stroke="${K.c}" stroke-width="2.9" stroke-dasharray="${K.dash}" stroke-linecap="round"/>
  <path d="M${x2},${y2} L${ax-5.4*Math.sin(ang)},${ay+5.4*Math.cos(ang)} L${ax+5.4*Math.sin(ang)},${ay-5.4*Math.cos(ang)} Z" fill="${K.c}" stroke="#04202F" stroke-opacity=".25" stroke-width=".8"/>`;
}

function LEGEND(items,arrows){
  const used=[...new Set((items||[]).map(i=>i.t))], k=[];
  for(const a of [...new Set((arrows||[]).map(a=>a.k))]) k.push({type:'ar',kind:a,l:ARROW_KINDS[a].label});
  if(used.includes('gk')) k.push({type:'gk',l:'حارس'});
  if(used.includes('at')) k.push({type:'at',l:'مهاجم'});
  if(used.includes('tm')) k.push({type:'tm',l:'زميل'});
  if(used.includes('ball')) k.push({type:'ball',l:'كرة'});
  if(used.includes('cone')) k.push({type:'cone',l:'كون'});
  const sel=k.slice(0,4); if(!sel.length) return '';
  let x=10, out=`<rect x="0" y="${H-30}" width="${W}" height="30" fill="#04202F" fill-opacity=".78"/>`;
  const cy=H-15;
  for(const it of sel){
    let w=20;
    if(it.type==='ar'){ const K=ARROW_KINDS[it.kind];
      out+=`<line x1="${x}" y1="${cy}" x2="${x+22}" y2="${cy}" stroke="${K.c}" stroke-width="2.7" stroke-dasharray="${K.dash}"/>`; w=26; }
    else if(it.type==='gk') out+=`<rect x="${x+2}" y="${cy-6}" width="15" height="12" rx="4" fill="url(#jerseyGK)"/>`;
    else if(it.type==='at') out+=`<rect x="${x+2}" y="${cy-6}" width="15" height="12" rx="4" fill="url(#jerseyAT)"/>`;
    else if(it.type==='tm') out+=`<rect x="${x+2}" y="${cy-6}" width="15" height="12" rx="4" fill="url(#jerseyTM)"/>`;
    else if(it.type==='ball') out+=`<circle cx="${x+9}" cy="${cy}" r="5" fill="url(#ballG)" stroke="#0A2233" stroke-width="1"/>`;
    else if(it.type==='cone') out+=`<path d="M${x+9},${cy-8} L${x+14},${cy+1} L${x+4},${cy+1} Z" fill="url(#coneG)"/>`;
    out+=`<text x="${x+w}" y="${cy+4}" font-family="Cairo,sans-serif" font-size="9.5" font-weight="600" fill="#fff">${it.l}</text>`;
    x+=w+it.l.length*5.5+11;
  }
  return out;
}

function SCENE(view,items,arrows,withLegend,tagged){
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${DEFS}${pitchOf(view)}`;
  (arrows||[]).forEach((a,i)=>{
    s += tagged ? `<g class="ar" data-a="${i}">${drawArrow(view,a)}</g>` : drawArrow(view,a);
  });
  const idx=(items||[]).map((it,i)=>({it,i})).sort((a,b)=>a.it.y-b.it.y);
  for(const o of idx){
    s += tagged ? `<g class="it" data-i="${o.i}">${drawItem(view,o.it)}</g>` : drawItem(view,o.it);
  }
  if(withLegend) s+=LEGEND(items,arrows);
  return s+`</svg>`;
}

/* ============ التحريك: رسم مرة وحدة + تحريك العناصر (بلا رعشة) ============ */
let ANIM={id:null,key:null,view:null,base:null,legend:true,plan:[],
          speed:1,playing:false,t0:0,pausedAt:0,nodes:null,arrows:null};

function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }
function lerp(a,b,t){ return a+(b-a)*t; }
function ease(t){ return t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }

function buildPlan(items,arrows){
  const plan=[];
  (arrows||[]).forEach((ar,ai)=>{
    const start={x:ar.x1,y:ar.y1};
    let best=-1,bd=9;
    items.forEach((it,i)=>{
      if(ar.k==='move' && !(it.t==='gk'||it.t==='at'||it.t==='tm')) return;
      if(ar.k==='pass' && it.t!=='ball') return;
      const d=dist(start,it); if(d<bd){ bd=d; best=i; }
    });
    if(best<0 || bd>0.34){
      items.forEach((it,i)=>{ if(it.t!=='ball') return; const d=dist(start,it); if(d<bd){bd=d;best=i;} });
    }
    plan.push({ai,idx:(bd<0.40?best:-1),ar});
  });
  return plan;
}

const STEP_MS=1100, GAP_MS=240, HOLD_MS=800;
function animTotal(n){ return n*(STEP_MS+GAP_MS)+HOLD_MS; }

function animBar(key){
  return `<div class="animbar" id="bar-${key}">
    <button class="ab" id="pp-${key}" onclick="toggleAnim()">⏸</button>
    <button class="ab" onclick="stepAnim(-1)">⏮</button>
    <button class="ab" onclick="stepAnim(1)">⏭</button>
    <span class="astep" id="stp-${key}">خطوة 1</span>
    <button class="ab sp" onclick="setSpeed(0.5)">0.5×</button>
    <button class="ab sp" onclick="setSpeed(1)">1×</button>
    <button class="ab sp" onclick="setSpeed(2)">2×</button>
    <button class="ab" onclick="stopAnim(true)">✕</button>
  </div>`;
}

function stopAnim(redraw){
  if(ANIM.id){ cancelAnimationFrame(ANIM.id); ANIM.id=null; }
  ANIM.playing=false;
  if(ANIM.key){
    const host=document.getElementById(ANIM.key);
    if(host && redraw!==false && ANIM.base){
      setSceneHTML(host,SCENE(ANIM.view,ANIM.base.items,ANIM.base.arrows,ANIM.legend));
    }
    const bar=document.getElementById('bar-'+ANIM.key);
    if(bar) bar.remove();
    ANIM.key=null; ANIM.nodes=null; ANIM.arrows=null;
  }
}

/* يحسب إزاحة العنصر في المنظور */
function offsetFor(view,it,nx,ny){
  const a=proj(view,it.x,it.y), b=proj(view,nx,ny);
  return {dx:b.x-a.x, dy:b.y-a.y, k:b.s/a.s};
}

function animFrame(t){
  const {base,plan,view,nodes,arrows}=ANIM;
  if(!nodes) return;
  const moved={};
  plan.forEach((p,i)=>{
    const s=i*(STEP_MS+GAP_MS), e=s+STEP_MS;
    let k = t>=e?1 : (t<s?0:ease((t-s)/STEP_MS));
    const arNode=arrows[p.ai];
    if(arNode) arNode.style.opacity = (t>=s)?'1':'0';
    if(k===0 || p.idx<0) return;
    const ar=p.ar, nx=lerp(ar.x1,ar.x2,k), ny=lerp(ar.y1,ar.y2,k);
    const it=base.items[p.idx];
    const o=offsetFor(view,it,nx,ny);
    moved[p.idx]=`translate(${o.dx.toFixed(2)},${o.dy.toFixed(2)}) `;
  });
  nodes.forEach((n,i)=>{ n.setAttribute('transform', moved[i]||''); });
  const stepNow=Math.min(plan.length,Math.floor(t/(STEP_MS+GAP_MS))+1);
  const lab=document.getElementById('stp-'+ANIM.key);
  if(lab) lab.textContent='خطوة '+stepNow+' / '+plan.length;
}

function playAnim(key,view,items,arrows,legend){
  if(ANIM.key===key){ ANIM.playing?pauseAnim():resumeAnim(); return; }
  stopAnim(true);
  const host=document.getElementById(key); if(!host) return;
  const base={items:JSON.parse(JSON.stringify(items)),arrows:arrows||[]};
  const plan=buildPlan(base.items,base.arrows);
  if(!plan.length) return;

  /* رسم واحد فقط، بعناصر موسومة */
  setSceneHTML(host,SCENE(view,base.items,base.arrows,legend!==false,true));

  const svg=host.querySelector('svg');
  if(!svg) return;
  const nodes=[], arNodes=[];
  Array.prototype.forEach.call(svg.querySelectorAll('g.it'),function(g){
    const i=g.getAttribute('data-i'); if(i!==null) nodes[+i]=g;
  });
  Array.prototype.forEach.call(svg.querySelectorAll('g.ar'),function(g){
    const a=g.getAttribute('data-a'); if(a!==null) arNodes[+a]=g;
  });
  if(!nodes.filter(Boolean).length) return;

  Object.assign(ANIM,{key,view,base,plan,legend:legend!==false,speed:1,
    playing:true,pausedAt:0,nodes,arrows:arNodes});

  if(!document.getElementById('bar-'+key)) host.insertAdjacentHTML('afterend',animBar(key));
  ANIM.t0=performance.now();
  loop();
}

function loop(){
  const total=animTotal(ANIM.plan.length);
  let last=0;
  function frame(now){
    if(!ANIM.playing) return;
    if(now-last>32){                 /* ~30 إطار في الثانية يكفي ويخفّف الحمل */
      animFrame(((now-ANIM.t0)*ANIM.speed)%total);
      last=now;
    }
    ANIM.id=requestAnimationFrame(frame);
  }
  ANIM.id=requestAnimationFrame(frame);
}
function pauseAnim(){
  if(!ANIM.key) return;
  const total=animTotal(ANIM.plan.length);
  ANIM.pausedAt=((performance.now()-ANIM.t0)*ANIM.speed)%total;
  ANIM.playing=false;
  if(ANIM.id){ cancelAnimationFrame(ANIM.id); ANIM.id=null; }
  const b=document.getElementById('pp-'+ANIM.key); if(b) b.textContent='▶';
}
function resumeAnim(){
  if(!ANIM.key) return;
  ANIM.playing=true;
  ANIM.t0=performance.now()-ANIM.pausedAt/ANIM.speed;
  const b=document.getElementById('pp-'+ANIM.key); if(b) b.textContent='⏸';
  loop();
}
function toggleAnim(){ ANIM.playing?pauseAnim():resumeAnim(); }
function setSpeed(v){
  if(!ANIM.key) return;
  const total=animTotal(ANIM.plan.length);
  const t=ANIM.playing?((performance.now()-ANIM.t0)*ANIM.speed)%total:ANIM.pausedAt;
  ANIM.speed=v; ANIM.t0=performance.now()-t/v; ANIM.pausedAt=t;
}
function stepAnim(dir){
  if(!ANIM.key) return;
  const unit=STEP_MS+GAP_MS;
  const total=animTotal(ANIM.plan.length);
  let t=ANIM.playing?((performance.now()-ANIM.t0)*ANIM.speed)%total:ANIM.pausedAt;
  let s=Math.max(0,Math.min(ANIM.plan.length-1,Math.floor(t/unit)+dir));
  ANIM.pausedAt=s*unit+STEP_MS;
  ANIM.playing=false;
  if(ANIM.id){ cancelAnimationFrame(ANIM.id); ANIM.id=null; }
  const b=document.getElementById('pp-'+ANIM.key); if(b) b.textContent='▶';
  animFrame(ANIM.pausedAt);
}

let _3dLoading=null;
function loadScript(src){
  return new Promise((res,rej)=>{
    const el=document.createElement('script');
    el.src=src; el.async=true;
    el.onload=()=>res(true);
    el.onerror=()=>rej(new Error('فشل تحميل '+src));
    document.head.appendChild(el);
    setTimeout(()=>rej(new Error('انتهت المهلة')), 15000);
  });
}
function ensure3D(){
  if(window.THREE && THREE.GLTFLoader) return Promise.resolve(true);
  if(_3dLoading) return _3dLoading;
  _3dLoading=(async()=>{
    if(!window.THREE) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js');

function mkPitchTexture(){
  const c=document.createElement('canvas'); c.width=1024; c.height=1024;
  const g=c.getContext('2d');
  const grd=g.createLinearGradient(0,0,0,1024);
  grd.addColorStop(0,'#2E7D46'); grd.addColorStop(1,'#3E9B58');
  g.fillStyle=grd; g.fillRect(0,0,1024,1024);
  g.globalAlpha=.10; g.fillStyle='#fff';
  for(let i=0;i<10;i+=2) g.fillRect(0,i*102.4,1024,102.4);
  g.globalAlpha=1;
  const px=x=>((x/P3.W)+0.5)*1024, pz=z=>(z/P3.D)*1024;
  g.strokeStyle='#fff'; g.lineWidth=5;
  g.strokeRect(px(-P3.W/2)+6,pz(0)+4,px(P3.W/2)-px(-P3.W/2)-12,pz(P3.D)-10);
  g.beginPath(); g.moveTo(0,pz(0)+4); g.lineTo(1024,pz(0)+4); g.stroke();
  g.strokeRect(px(-20.16),pz(0),px(20.16)-px(-20.16),pz(16.5));   // منطقة الجزاء
  g.strokeRect(px(-9.16),pz(0),px(9.16)-px(-9.16),pz(5.5));       // المنطقة الصغيرة
  g.beginPath(); g.arc(px(0),pz(11),Math.abs(px(9.15)-px(0)),0.25*Math.PI,0.75*Math.PI); g.stroke();
  g.fillStyle='#fff'; g.beginPath(); g.arc(px(0),pz(11),7,0,7); g.fill();
  const t=new THREE.Texture(c); t.needsUpdate=true; return t;
}

function mkGoal(){
  const g=new THREE.Group();
  const mat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.5,metalness:.1});
  const r=0.07;
  const post=(x)=>{ const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,GOAL.h,12),mat);
    m.position.set(x,GOAL.h/2,0); m.castShadow=true; g.add(m); };
  post(-GOAL.w/2); post(GOAL.w/2);
  const bar=new THREE.Mesh(new THREE.CylinderGeometry(r,r,GOAL.w+r*2,12),mat);
  bar.rotation.z=Math.PI/2; bar.position.set(0,GOAL.h,0); bar.castShadow=true; g.add(bar);
  const back=(x)=>{ const m=new THREE.Mesh(new THREE.CylinderGeometry(r*.7,r*.7,GOAL.h*.65,10),mat);
    m.position.set(x,GOAL.h*.33,-GOAL.d); g.add(m); };
  back(-GOAL.w/2); back(GOAL.w/2);
  // الشباك
  const nm=new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.4});
  const seg=[];
  const push=(a,b)=>seg.push(a.x,a.y,a.z,b.x,b.y,b.z);
  const V=(x,y,z)=>({x,y,z});
  for(let i=0;i<=12;i++){ const x=-GOAL.w/2+GOAL.w*i/12;
    push(V(x,GOAL.h,0),V(x,GOAL.h*.72,-GOAL.d));
    push(V(x,0,-GOAL.d),V(x,GOAL.h*.72,-GOAL.d)); }
  for(let j=0;j<=5;j++){ const y=GOAL.h*j/5;
    push(V(-GOAL.w/2,y,-GOAL.d),V(GOAL.w/2,y,-GOAL.d)); }
  for(let j=0;j<=4;j++){ const t=j/4;
    push(V(-GOAL.w/2,GOAL.h*(1-t*.28),-GOAL.d*t),V(-GOAL.w/2,GOAL.h*(1-t*.28),-GOAL.d*t)); }
  const bg=new THREE.BufferGeometry();
  bg.setAttribute('position',new THREE.Float32BufferAttribute(seg,3));
  g.add(new THREE.LineSegments(bg,nm));
  return g;
}

function mkPath(ar){
  const c = ar.k==='pass'?0xffffff : (ar.k==='dribble'?0xFFD277:0xFF6B4A);
  const a=f2w(ar.x1,ar.y1), b=f2w(ar.x2,ar.y2);
  const pts=[];
  const lift = ar.k==='pass'?1.1:0;
  for(let i=0;i<=24;i++){ const t=i/24;
    pts.push(new THREE.Vector3(a.x+(b.x-a.x)*t, .06+Math.sin(Math.PI*t)*lift, a.z+(b.z-a.z)*t)); }
  const geo=new THREE.BufferGeometry().setFromPoints(pts);
  const mat = ar.k==='pass'
    ? new THREE.LineBasicMaterial({color:c})
    : new THREE.LineDashedMaterial({color:c,dashSize:.5,gapSize:.35});
  const line=new THREE.Line(geo,mat);
  if(mat.isLineDashedMaterial) line.computeLineDistances();
  const head=new THREE.Mesh(new THREE.ConeGeometry(.22,.5,10),new THREE.MeshBasicMaterial({color:c}));
  const dir=new THREE.Vector3(b.x-a.x,0,b.z-a.z).normalize();
  head.position.set(b.x,.25,b.z);
  head.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir);
  const g=new THREE.Group(); g.add(line); g.add(head); return g;
}

  scene.add(ground);
  const wide=new THREE.Mesh(new THREE.PlaneGeometry(200,200),

    orbit:{r:28,th:Math.PI/2,ph:0.85,tx:0,ty:0,tz:10},preset:preset||'angle'};
  applyPreset(state,state.preset);

  R3=state;
  return state;
}
function applyPreset(S,k){
  const P=CAM_PRESETS[k]||CAM_PRESETS.angle;
  const [x,y,z]=P.p, [tx,ty,tz]=P.t;
  const dx=x-tx, dy=y-ty, dz=z-tz;
  S.orbit.r=Math.hypot(dx,dy,dz);
  S.orbit.ph=Math.acos(Math.max(-1,Math.min(1,dy/S.orbit.r)));
  S.orbit.th=Math.atan2(dz,dx);
  S.orbit.tx=tx; S.orbit.ty=ty; S.orbit.tz=tz;
  S.preset=k; updCam(S);
}
function updCam(S){
  const o=S.orbit;
  const x=o.tx+o.r*Math.sin(o.ph)*Math.cos(o.th);
  const y=o.ty+o.r*Math.cos(o.ph);
  const z=o.tz+o.r*Math.sin(o.ph)*Math.sin(o.th);
  S.camera.position.set(x,Math.max(1.2,y),z);
  S.camera.lookAt(o.tx,o.ty+1,o.tz);
}
function bindOrbit(S){
  let drag=false,lx=0,ly=0,pd=0;
  const cv=S.cv;
  cv.style.touchAction='none';
  cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId);});
  cv.addEventListener('pointerup',e=>{drag=false;});
  cv.addEventListener('pointercancel',()=>drag=false);
  cv.addEventListener('pointermove',e=>{
    if(!drag) return;
    S.orbit.th-= (e.clientX-lx)*0.007;
    S.orbit.ph = Math.max(0.18,Math.min(1.45,S.orbit.ph+(e.clientY-ly)*0.006));
    lx=e.clientX; ly=e.clientY; updCam(S); render3D();
  });
  cv.addEventListener('wheel',e=>{ e.preventDefault();
    S.orbit.r=Math.max(8,Math.min(70,S.orbit.r+e.deltaY*0.03)); updCam(S); render3D(); },{passive:false});
  let t2=null;
  cv.addEventListener('touchmove',e=>{
    if(e.touches.length!==2) return;
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(t2) { S.orbit.r=Math.max(8,Math.min(70,S.orbit.r+(t2-d)*0.08)); updCam(S); render3D(); }
    t2=d;
  },{passive:true});
  cv.addEventListener('touchend',()=>{t2=null;});
}
let _clock=null;
function render3D(){
  if(!R3) return;
  if(typeof document!=='undefined' && document.hidden) return;
  if(!_clock && window.THREE) _clock=new THREE.Clock();
  if(_clock && R3.map){
    const d=_clock.getDelta();
    for(const m of R3.map){ if(m.o.userData && m.o.userData.mixer) m.o.userData.mixer.update(d); }
  }
  R3.renderer.render(R3.scene,R3.camera);
}

function load3D(items,arrows){
  if(!R3) return;
  while(R3.objs.children.length) R3.objs.remove(R3.objs.children[0]);
  while(R3.paths.children.length) R3.paths.remove(R3.paths.children[0]);
  R3.map=[];
  (items||[]).forEach(it=>{
    const o=mkObject(it); if(!o) return;
    const p=f2w(it.x,it.y); o.position.x=p.x; o.position.z=p.z;
    if(it.t==='gk'||it.t==='at'||it.t==='tm'){
      const look=f2w(.5,it.y>0.2?0:1);
      o.rotation.y = it.t==='gk' ? Math.PI : 0;
    }
    R3.objs.add(o); R3.map.push({it,o});
  });
  (arrows||[]).forEach(a=>R3.paths.add(mkPath(a)));
  R3.base={items:JSON.parse(JSON.stringify(items||[])),arrows:arrows||[]};
  render3D();
}

/* تحريك المشهد ثلاثي الأبعاد */
let A3={id:null,on:false};
function stop3D(){ if(A3.id){cancelAnimationFrame(A3.id);A3.id=null;} A3.on=false;
  const b=document.getElementById('btn3d'); if(b) b.textContent='▶ شغّل';
  if(R3&&R3.base) load3D(R3.base.items,R3.base.arrows);
}
function play3D(){
  if(!R3||!R3.base) return;
  if(A3.on){ stop3D(); return; }
  const base=R3.base, plan=buildPlan(base.items,base.arrows);
  if(!plan.length) return;
  A3.on=true;
  const b=document.getElementById('btn3d'); if(b) b.textContent='⏸ وقّف';
  const STEP=1200,GAP=300,HOLD=900, total=plan.length*(STEP+GAP)+HOLD, t0=performance.now();
  function frame(now){
    if(!A3.on) return;
    const t=(now-t0)%total;
    const cur=JSON.parse(JSON.stringify(base.items));
    plan.forEach((p,i)=>{
      const s=i*(STEP+GAP), e=s+STEP;
      let k = t>=e?1 : (t<s?0:ease((t-s)/STEP));
      if(k===0) return;
      const ar=p.ar, nx=lerp(ar.x1,ar.x2,k), ny=lerp(ar.y1,ar.y2,k);
      if(p.idx>=0){ cur[p.idx].x=nx; cur[p.idx].y=ny; cur[p.idx]._h = ar.k==='pass'?Math.sin(Math.PI*k)*1.6:0; }
    });
    R3.map.forEach((m,i)=>{
      const it=cur[i]; if(!it) return;
      const p=f2w(it.x,it.y);
      m.o.position.x=p.x; m.o.position.z=p.z;
      if(it.t==='ball') m.o.position.y=.11+(it._h||0);
    });
    render3D();
    A3.id=requestAnimationFrame(frame);
  }
  A3.id=requestAnimationFrame(frame);
}

  ensureScene('sc-'+i,ex);
  playAnim('sc-'+i,ex.view,ex.items,ex.arrows,true);
}
function playTac(i){
  const t=TACTICS[i]; if(!t) return;
  ensureScene('tc-'+i,t);
  playAnim('tc-'+i,t.view,t.items,t.arrows,true);
}
function delEx(i){
  if(!confirm('تمسح هذا التمرين؟')) return;
  BANK[curTheme].splice(i,1); saveCustom(); renderBody();
}

/* ===== التخزين: عند الحاجة فقط ===== */
const STORE='gk-custom-v3';
function saveCustom(){
  try{
    const custom={},extra=[];
    for(const t of THEMES){
      const rows=(BANK[t.slug]||[]).filter(r=>r.custom);
      if(rows.length) custom[t.slug]=rows;
      if(!SEED.bank[t.slug]) extra.push({slug:t.slug,name:t.name});
    }
    localStorage.setItem(STORE,JSON.stringify({custom,extra}));
  }catch(e){}
}
function loadCustom(){
  try{
    const raw=localStorage.getItem(STORE); if(!raw) return;
    const d=JSON.parse(raw); if(!d||!d.custom) return;
    for(const t of (d.extra||[])) if(!THEMES.find(x=>x.slug===t.slug)) THEMES.push(t);
    for(const k of Object.keys(d.custom)){
      if(!BANK[k]) BANK[k]=[];
      BANK[k]=BANK[k].filter(r=>!r.custom).concat(d.custom[k]);
    }
  }catch(e){}
}

/* ===== صانع التمرين ===== */
let ED={view:'box3d',items:[],arrows:[],tool:'gk',pose:'set',pending:null};
function viewBuilder(){
  return `<div class="panel">
    <h3>ارسم التمرين</h3>
    <label>رؤية الملعب</label>
    <select onchange="ED.view=this.value;drawB()">
      ${Object.entries(VIEWS).map(([k,v])=>`<option value="${k}"${k===ED.view?' selected':''}>${v.label}</option>`).join('')}
    </select>
    <div class="palette" id="palette"></div>
    <div id="poseRow"></div>
    <div class="board" id="board"></div>
    <div class="bbar">
      <span class="hint" id="bHint"></span>
      <button class="mini" onclick="undoB()">↶ تراجع</button>
      <button class="mini" onclick="clearB()">مسح</button>
    </div>
    <label>Theme</label><input id="b_theme" placeholder="مثلاً: 1v1 Inside Box">
    <label>اسم التمرين</label><input id="b_name">
    <div class="row2">
      <div><label>الفئة</label><select id="b_age">${AGES.slice(1).map(a=>`<option${a==='U15'?' selected':''}>${a}</option>`).join('')}</select></div>
      <div><label>المرحلة</label><select id="b_phase"><option>إحماء / تقنية</option><option>تقنية</option><option selected>موقفي</option><option>قرار</option><option>لعبة موجّهة</option><option>مدمج</option><option>خاص</option></select></div>
    </div>
    <div class="row2">
      <div><label>المدة</label><input id="b_dur" placeholder="15'"></div>
      <div><label>التكرار</label><input id="b_reps" placeholder="8×"></div>
      <div><label>الراحة</label><input id="b_rec" placeholder="45s"></div>
    </div>
    <label>الهدف</label><input id="b_obj">
    <label>كيفية الأداء</label><input id="b_der">
    <label>المعدات</label><input id="b_mat">
    <label>نقاط تدريبية</label><input id="b_pts">
    <button class="go" onclick="saveEx()">حفظ التمرين</button>
    <div id="okMsg" style="display:none;color:var(--deep);font-weight:700;text-align:center;margin-top:8px;font-size:.8rem">تحفظ ✓</div>
  </div>`;
}
function initBuilder(){ renderPalette(); drawB(); }
function renderPalette(){
  const p=document.getElementById('palette'); if(!p) return;
  p.innerHTML=Object.entries(TOOLS).map(([k,v])=>`<button class="tl${ED.tool===k?' on':''}" onclick="pickTool('${k}')">${v.label}</button>`).join('')
   +Object.entries(ARROW_KINDS).map(([k,v])=>`<button class="tl${ED.tool===k?' on':''}" onclick="pickTool('${k}')">↗ ${v.label}</button>`).join('');
  const pr=document.getElementById('poseRow');
  if(pr) pr.innerHTML = ED.tool==='gk'
    ? `<div class="palette sub">${Object.entries(GK_POSES).map(([k,l])=>`<button class="tl sm${ED.pose===k?' on':''}" onclick="pickPose('${k}')">${l}</button>`).join('')}</div>` : '';
}
function pickTool(t){ ED.tool=t; ED.pending=null; renderPalette(); hint(); }
function pickPose(p){ ED.pose=p; renderPalette(); hint(); }
function clearB(){ ED.items=[]; ED.arrows=[]; ED.pending=null; drawB(); }
function hint(){
  const h=document.getElementById('bHint'); if(!h) return;
  h.textContent = ARROW_KINDS[ED.tool] ? (ED.pending?'انقر على نقطة النهاية':'انقر على نقطة البداية')
    : ('انقر على الملعب لوضع: '+(TOOLS[ED.tool]||{}).label+(ED.tool==='gk'?' — '+GK_POSES[ED.pose]:''));
}
function drawB(){
  const el=document.getElementById('board'); if(!el) return;
  el.innerHTML=SCENE(ED.view,ED.items,ED.arrows,false);
  const svg=el.querySelector('svg'); if(svg) svg.addEventListener('click',tapB);
  hint();
}
function tapB(e){
  const svg=e.currentTarget, r=svg.getBoundingClientRect();
  const px=((e.clientX-r.left)/r.width)*W, py=((e.clientY-r.top)/r.height)*H;
  const f=unproj(ED.view,px,py);
  if(ARROW_KINDS[ED.tool]){
    if(!ED.pending) ED.pending=f;
    else { ED.arrows.push({k:ED.tool,x1:ED.pending.fx,y1:ED.pending.fy,x2:f.fx,y2:f.fy}); ED.pending=null; }
  }else{
    const it={t:ED.tool,x:f.fx,y:f.fy};
    if(ED.tool==='gk'){ it.pose=ED.pose; it.lb='GK'; }
    if(ED.tool==='at') it.lb=String(ED.items.filter(i=>i.t==='at').length+1);
    if(ED.tool==='tm') it.lb=String(ED.items.filter(i=>i.t==='tm').length+2);
    ED.items.push(it);
  }
  drawB();
}
function undoB(){ if(ED.pending) ED.pending=null; else if(ED.items.length) ED.items.pop(); else if(ED.arrows.length) ED.arrows.pop(); drawB(); }
function saveEx(){
  const g=(id)=>((document.getElementById(id)||{}).value||'').trim();
  const tn=g('b_theme'), n=g('b_name');
  if(!tn||!n){ alert('حط اسم الـTheme واسم التمرين'); return; }
  if(!ED.items.length&&!ED.arrows.length){ alert('ارسم التمرين أولاً'); return; }
  const s=tn.toLowerCase().replace(/\s+/g,'-');
  const ex={name:n,age:g('b_age'),phase:g('b_phase'),dur:g('b_dur'),reps:g('b_reps'),rec:g('b_rec'),
    obj:g('b_obj'),der:g('b_der'),mat:g('b_mat'),points:g('b_pts'),
    view:ED.view,items:ED.items.slice(),arrows:ED.arrows.slice(),custom:true};
  if(!BANK[s]) BANK[s]=[];
  BANK[s].push(ex);
  if(!THEMES.find(t=>t.slug===s)) THEMES.push({slug:s,name:tn});
  saveCustom();
  const m=document.getElementById('okMsg'); if(m){ m.style.display='block'; setTimeout(()=>{m.style.display='none';},2200); }
  clearB();
  ['b_name','b_obj','b_der','b_pts'].forEach(i=>{ const e=document.getElementById(i); if(e) e.value=''; });
  curTheme=s; curAge='all';
  const c=document.getElementById('sEx');
  if(c) c.textContent=Object.values(BANK).reduce((a,b)=>a+b.length,0);
}

/* ===== عرض 3D ===== */
let SEL3D=0;
function open3D(i){ SEL3D=i; goTab('v3d'); }
function view3D(){
  const rows=BANK[curTheme]||[];
  if(!rows.length) return '<div class="empty">اختار Theme فيه تمارين.</div>';
  if(SEL3D>=rows.length) SEL3D=0;
  const ex=rows[SEL3D];
  return `<div class="panel">
    <label>التمرين</label>
    <select onchange="SEL3D=+this.value;renderBody()">
      ${rows.map((r,i)=>`<option value="${i}"${i===SEL3D?' selected':''}>${i+1}. ${r.name}</option>`).join('')}
    </select>
    <div class="cv3d"><canvas id="cv3d"></canvas><div class="cvhint">اسحب لتدوير الكاميرا</div></div>
    <div class="chips" style="margin-top:9px">
      ${Object.entries(CAM_PRESETS).map(([k,v])=>`<button class="chip" onclick="setCam('${k}')">${v.label}</button>`).join('')}
    </div>
    <button class="go" id="btn3d" onclick="play3D()">شغّل الحركة</button>
    <div class="blk" style="margin-top:12px"><b>${ex.name}</b><p>${ex.obj||''}</p></div>
  </div>`;
}
function mount3D(){
  const rows=BANK[curTheme]||[]; const ex=rows[SEL3D]; if(!ex) return;
  const box=document.getElementById('cv3d');
  if(box&&box.parentNode) box.parentNode.insertAdjacentHTML('beforeend','<div class="cvload" id="cvload">يحضّر العرض…</div>');
  ensure3D().then(function(ok){
    const l=document.getElementById('cvload'); if(l) l.remove();
    if(!ok||!window.THREE){
      const c=document.getElementById('cv3d');
      if(c&&c.parentNode) c.parentNode.innerHTML='<div class="empty" style="margin:0">العرض 3D يحتاج أنترنت في أول مرة.</div>';
      return;
    }
    const S=init3D('cv3d','angle'); if(S) load3D(ex.items,ex.arrows);
  }).catch(function(){ const l=document.getElementById('cvload'); if(l) l.remove(); });
}
function setCam(k){ if(R3){ applyPreset(R3,k); render3D(); } }
function makeActor(kind,label){ return mkPlayer(kind,label); }

renderTabs(); renderChips(); renderBody();
